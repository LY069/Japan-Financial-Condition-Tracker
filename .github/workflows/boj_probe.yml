name: BoJ connector probe

# Manual diagnostic: reports which Bank of Japan endpoints (API, flat files,
# per-statistic release pages) respond from a runner, so series codes can be
# pinned from evidence. Read-only; commits nothing.
on:
  workflow_dispatch:
    inputs:
      run_probe:
        description: "Run the full connectivity probe (true/false)"
        required: false
        default: "false"
      discover_db:
        description: "Optional: database to search for codes (e.g. CO, IR04)"
        required: false
        default: ""
      discover_keyword:
        description: "Optional: keyword to match in series names"
        required: false
        default: ""
      run_targets:
        description: "Search every database we need codes from (true/false)"
        required: false
        default: "false"
      run_hunt:
        description: "Search for the six series still seeded (true/false)"
        required: false
        default: "false"
      run_files:
        description: "Check gap.xlsx and outside sources (true/false)"
        required: false
        default: "false"
      run_dbscan:
        description: "Map which databases exist and hold the outstanding series (true/false)"
        required: false
        default: "false"
      find_terms:
        description: 'Optional: DB then quoted terms, e.g. CO "Lending Attitude" "All Industries"'
        required: false
        default: ""
      dump_db:
        description: "Optional: database for a raw series dump"
        required: false
        default: "CO"
      dump_code:
        description: "Optional: series code for a raw series dump"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe BoJ endpoints
        if: inputs.run_probe == 'true'
        run: python etl/boj_api.py --probe
      - name: Discover series codes
        if: inputs.discover_db != '' && inputs.discover_keyword != ''
        run: python etl/boj_api.py --discover "${{ inputs.discover_db }}" "${{ inputs.discover_keyword }}"
      - name: Search every database we need codes from
        if: inputs.run_targets == 'true'
        run: python etl/boj_api.py --targets
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Hunt for the still-seeded series
        if: inputs.run_hunt == 'true'
        run: python etl/boj_api.py --hunt
      - name: Check published files and outside sources
        if: inputs.run_files == 'true'
        run: python etl/boj_api.py --files
      - name: Map the database namespace
        if: inputs.run_dbscan == 'true'
        run: python etl/boj_api.py --dbscan
      - name: Find codes by combined terms
        if: inputs.find_terms != ''
        run: python etl/boj_api.py --find ${{ inputs.find_terms }}
      - name: Dump one series response
        if: inputs.dump_code != ''
        run: python etl/boj_api.py --dump "${{ inputs.dump_db }}" "${{ inputs.dump_code }}"
